name: Cosmetics Integration Runtime Test

on:
  push:
    branches:
      - refactor/use-cosmetics-integration-api-v2
      - feature/cosmetics-inventory-collections
      - feature/cosmetics-loadouts-ui
      - feature/cosmetics-live-preview-studio

permissions:
  contents: read

jobs:
  discourse-ruby:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:release
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      LOAD_PLUGINS: 1
      PGUSER: discourse
      PGPASSWORD: discourse
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned Discourse
        uses: actions/checkout@v6
        with:
          repository: discourse/discourse
          ref: 504fee3518fdbb10537eb1a92e54ff551dd66cc3
          path: discourse
          fetch-depth: 1

      - name: Checkout exact User Cosmetics preview candidate
        uses: actions/checkout@v6
        with:
          repository: dupless54/discourse-user-cosmetics
          ref: 8ba41ad7550c4f2001a7a125a3b5370b342f9b97
          path: discourse/plugins/discourse-user-cosmetics
          fetch-depth: 1

      - name: Checkout Store branch
        uses: actions/checkout@v6
        with:
          path: discourse/plugins/discourse-user-cosmetics-store
          fetch-depth: 1

      - name: Prepare Discourse test environment
        working-directory: discourse
        run: |
          chown root:root .
          redis-server /etc/redis/redis.conf &
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';" || true
          sudo -u postgres createdb -O "$PGUSER" discourse_test
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle config set --local without development
          bundle install --jobs $(($(nproc) - 1))
          pnpm install --frozen-lockfile

      - name: Migrate both plugins
        working-directory: discourse
        run: bin/rake db:migrate

      - name: Verify public integration contract is active
        working-directory: discourse
        run: >-
          bin/rails runner '
          abort "base Integration API unavailable" unless defined?(DiscourseUserCosmetics::Integration);
          abort "base loadout API unavailable" unless DiscourseUserCosmetics::Integration.respond_to?(:loadouts_supported?) && DiscourseUserCosmetics::Integration.loadouts_supported?;
          abort "base preview read API unavailable" unless DiscourseUserCosmetics::Integration.respond_to?(:current_selections_for);
          abort "base preview apply API unavailable" unless DiscourseUserCosmetics::Integration.respond_to?(:apply_selections!);
          abort "store integration unavailable" unless DiscourseCosmeticsStore.base_integration_ready?;
          abort "store provider installation failed" unless DiscourseCosmeticsStore.install_cosmetics_integration!;
          puts "cosmetics preview integration contract OK"'

      - name: Run Store specs directly
        working-directory: discourse
        run: bin/rspec plugins/discourse-user-cosmetics-store/spec

      - name: Run Store specs via Discourse plugin task
        working-directory: discourse
        run: bin/rake 'plugin:spec[discourse-user-cosmetics-store]'

      - name: Run Store QUnit when tests exist
        working-directory: discourse
        run: |
          TEST_ROOT="plugins/discourse-user-cosmetics-store/test/javascripts"
          if [ -d "$TEST_ROOT" ] && find "$TEST_ROOT" -type f \( -name '*-test.js' -o -name '*-test.gjs' -o -name '*_test.js' -o -name '*_test.gjs' \) -print -quit | grep -q .; then
            bin/qunit --standalone --target discourse-user-cosmetics-store
          else
            echo "No Store QUnit tests found; skipping plugin QUnit target."
          fi
