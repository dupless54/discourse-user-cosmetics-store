name: Cosmetics Integration Runtime Test

on:
  push:
    branches:
      - refactor/use-cosmetics-integration-api-v2
      - feature/cosmetics-inventory-collections
      - feature/cosmetics-loadouts-ui
      - integration/merge-loadouts-mobile-main
      - feature/cosmetics-live-preview-studio
      - feature/cosmetics-rarity-limited-seasonal
      - integration/cosmetics-store-release-candidate
      - feature/store-activity-center
      - integration/store-admin-health-release-candidate
      - feature/cosmetics-admin-health-check
      - feature/cosmetics-admin-audit-log
      - feature/cosmetics-integration-contract-consumer
      - integration/cosmetics-store-final-release-candidate
      - integration/merge-final-store-main
      - integration/merge-final-store-main-v2

permissions:
  contents: read

jobs:
  discourse-ruby:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:release
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      LOAD_PLUGINS: 1
      PGUSER: discourse
      PGPASSWORD: discourse
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned Discourse
        uses: actions/checkout@v6
        with:
          repository: discourse/discourse
          ref: 504fee3518fdbb10537eb1a92e54ff551dd66cc3
          path: discourse
          fetch-depth: 1

      - name: Checkout exact User Cosmetics main
        uses: actions/checkout@v6
        with:
          repository: dupless54/discourse-user-cosmetics
          ref: 8c41e4cf072282e5e554a21e815fd1d1567c5a28
          path: discourse/plugins/discourse-user-cosmetics
          fetch-depth: 1

      - name: Checkout Store branch
        uses: actions/checkout@v6
        with:
          path: discourse/plugins/discourse-user-cosmetics-store
          fetch-depth: 1

      - name: Prepare Discourse test environment
        working-directory: discourse
        run: |
          chown root:root .
          redis-server /etc/redis/redis.conf &
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';" || true
          sudo -u postgres createdb -O "$PGUSER" discourse_test
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle config set --local without development
          bundle install --jobs $(($(nproc) - 1))
          pnpm install --frozen-lockfile

      - name: Migrate both plugins
        working-directory: discourse
        run: bin/rake db:migrate

      - name: Verify versioned public integration contract is active
        working-directory: discourse
        run: >-
          bin/rails runner '
          abort "base Integration API unavailable" unless defined?(DiscourseUserCosmetics::Integration);
          abort "base contract version mismatch" unless DiscourseUserCosmetics::Integration.contract_version == 1;
          %i[ownership entitlements grants selections loadouts showcase].each do |capability|
            abort "base capability unavailable: #{capability}" unless DiscourseUserCosmetics::Integration.supports?(capability);
          end;
          abort "store BaseContract adapter unavailable" unless defined?(DiscourseCosmeticsStore::BaseContract);
          abort "store is not using manifest mode" unless DiscourseCosmeticsStore::BaseContract.mode == :manifest;
          abort "store contract version mismatch" unless DiscourseCosmeticsStore::BaseContract.version == 1;
          abort "store core Integration unavailable" unless DiscourseCosmeticsStore::BaseContract.core_ready?;
          abort "store selections capability unavailable" unless DiscourseCosmeticsStore::BaseContract.capability?(:selections);
          abort "store loadouts capability unavailable" unless DiscourseCosmeticsStore::BaseContract.capability?(:loadouts);
          abort "store provider installation failed" unless DiscourseCosmeticsStore.install_cosmetics_integration!;
          abort "gift notification type unavailable" unless DiscourseCosmeticsStore.install_notification_type!;
          puts "cosmetics final Integration contract v1 and Store notification bridge OK"'

      - name: Run Store specs directly
        working-directory: discourse
        run: bin/rspec plugins/discourse-user-cosmetics-store/spec

      - name: Run Store specs via Discourse plugin task
        working-directory: discourse
        run: bin/rake 'plugin:spec[discourse-user-cosmetics-store]'

      - name: Run Store QUnit when tests exist
        working-directory: discourse
        run: |
          TEST_ROOT="plugins/discourse-user-cosmetics-store/test/javascripts"
          if [ -d "$TEST_ROOT" ] && find "$TEST_ROOT" -type f \( -name '*-test.js' -o -name '*-test.gjs' -o -name '*_test.js' -o -name '*_test.gjs' \) -print -quit | grep -q .; then
            bin/qunit --standalone --target discourse-user-cosmetics-store
          else
            echo "No Store QUnit tests found; skipping plugin QUnit target."
          fi
