plugins:
  discourse_cosmetics_store_enabled:
    default: true
    client: true

  discourse_cosmetics_store_currency_name:
    default: "Orbs"
    client: true

  discourse_cosmetics_store_currency_symbol:
    default: "◈"
    client: true

  discourse_cosmetics_store_starting_balance:
    default: 0
    min: 0
    max: 1000000

  discourse_cosmetics_store_max_balance:
    default: 1000000000
